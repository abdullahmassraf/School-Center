<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- theme-controlled tokens (rewritten live by THEME_PRESETS / custom picker) ---- */
    --ink:#F4F6FD;
    --muted:#A7B0D6;
    --muted-dim:#7981A8;
    --accent:#8B7CF6;
    --accent-2:#34D1BF;
    --accent-3:#F0608A;
    --bg-1:#0B0F2E;
    --bg-2:#0E1A3D;
    --bg-3:#0A2A44;
    --lava-a:#8B7CF6;
    --lava-b:#5B4FD6;
    --lava-c:#34D1BF;
    --lava-d:#F0608A;

    /* ---- iPhone-glass tokens (derived, but exposed so panels stay consistent) ---- */
    --glass: rgba(255,255,255,0.07);
    --glass-hi: rgba(255,255,255,0.14);
    --glass-border: rgba(255,255,255,0.22);
    --glass-spec: rgba(255,255,255,0.55);
    --hairline: rgba(255,255,255,0.09);
    --radius-lg: 22px;
    --radius-md: 15px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-1);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', sans-serif;
    font-size:16px;
    line-height:1.65;
    letter-spacing:0.01em;
    -webkit-font-smoothing:antialiased;
  }
  .headfont{font-family:'Space Grotesk', sans-serif;}
  #app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:26px 16px 90px;}

  /* ---------- lava lamp interactive background ---------- */
  #lava-wrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);}
  #lava-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #lava-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1400px 900px at 50% -10%, rgba(255,255,255,0.05), transparent 60%);}
  #lava-vignette{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 160px 40px rgba(4,6,20,0.55);}

  /* ---------- true glass (iPhone-style) ---------- */
  .glass-surface{
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    box-shadow:
      0 1px 0 0 var(--glass-spec) inset,
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 18px 40px -12px rgba(2,4,16,0.55);
    position:relative;
  }
  .glass-surface::before{
    content:"";position:absolute;top:0;left:8%;right:8%;height:1px;border-radius:99px;
    background:linear-gradient(90deg, transparent, var(--glass-spec), transparent);
    opacity:0.5;pointer-events:none;
  }

  @keyframes riseIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  .enter{animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  #app > *{animation:viewIn .35s ease both;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    margin-bottom:22px;}
  .topbar h1{font-family:'Space Grotesk';font-weight:700;font-size:1.65rem;margin:0;letter-spacing:0.01em;}
  .topbar .sub{color:var(--muted);font-size:0.9rem;margin-top:2px;}
  .today-badge{font-family:'Space Grotesk';font-size:0.78rem;color:var(--ink);
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    padding:6px 14px;border-radius:999px;white-space:nowrap;
    box-shadow:0 1px 0 0 var(--glass-spec) inset;}

  .progress-pill{display:flex;align-items:center;gap:10px;font-size:0.78rem;color:var(--muted);
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));border:1px solid var(--glass-border);
    border-radius:999px;padding:6px 14px 6px 6px;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset;}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:50%;background:linear-gradient(155deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);color:var(--ink);cursor:pointer;font-size:1rem;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset;transition:transform .15s ease, border-color .15s ease;}
  .icon-btn:hover{transform:translateY(-1px) scale(1.04);border-color:var(--accent);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0.9;}
  .icon-inline{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-inline svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .progress-track{display:flex;gap:3px;}
  .progress-seg{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,0.14);}
  .progress-seg.on{background:var(--seg-color, var(--accent));}

  /* glass panel */
  .panel{position:relative;
    background:linear-gradient(160deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    border-radius:var(--radius-lg);
    box-shadow:
      0 1px 0 0 var(--glass-spec) inset,
      0 18px 40px -12px rgba(2,4,16,0.55);
    padding:20px 20px 22px;margin-bottom:20px;overflow:hidden;}
  .panel::before{
    content:"";position:absolute;top:0;left:8%;right:8%;height:1px;border-radius:99px;
    background:linear-gradient(90deg, transparent, var(--glass-spec), transparent);
    opacity:0.5;pointer-events:none;}
  .panel h2{font-family:'Space Grotesk';font-size:1rem;font-weight:600;margin:0 0 14px;color:var(--ink);}

  .panel-flush{padding:0;overflow:hidden;}

  /* practice studio — true fullscreen overlay, independent of #app's layout */
  .ps-fullscreen{position:fixed;inset:0;z-index:80;background:#0B0F19;display:flex;flex-direction:column;}
  .ps-topbar{display:flex;align-items:center;gap:12px;padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top));
    background:#0B0F19;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
  .ps-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:0.85rem;
    padding:6px 10px;border-radius:999px;transition:background .15s ease, color .15s ease;}
  .ps-back:hover{background:rgba(255,255,255,0.08);color:var(--ink);}
  .ps-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ps-label{font-family:'Space Grotesk';font-size:0.85rem;font-weight:600;color:var(--ink);}
  .ps-iframe{flex:1;width:100%;border:none;background:#0B0F19;}

  .dim-divider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--muted-dim);font-size:0.75rem;
    font-family:'Space Grotesk';}
  .dim-divider::before,.dim-divider::after{content:"";flex:1;height:1px;background:var(--hairline);}

  /* weekly schedule */
  .week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  @media(max-width:680px){.week-grid{grid-template-columns:1fr;}}
  .day-col{border:1px solid var(--hairline);border-radius:var(--radius-md);padding:12px;min-height:76px;
    background:rgba(255,255,255,0.02);transition:border-color .2s ease;}
  .day-col.is-today{border-color:rgba(139,124,246,0.55);background:rgba(139,124,246,0.08);}
  .day-name{font-family:'Space Grotesk';font-size:0.8rem;color:var(--muted);margin-bottom:9px;font-weight:600;}
  .day-col.is-today .day-name{color:#C4BAFF;}
  .block{border-left:3px solid var(--block-color, #8B7CF6);
    background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    padding:7px 9px;margin-bottom:7px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    cursor:pointer;font-size:0.82rem;transition:transform .15s ease, background .15s ease;}
  .block:hover{transform:translateX(3px);background:linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));}
  .block .t{color:var(--muted);font-size:0.71rem;}
  .block .c{font-weight:700;}
  .empty-day{color:var(--muted-dim);font-size:0.78rem;font-style:italic;}

  /* calendar widget */
  .cal-widget{padding-bottom:14px;}
  .cal-widget-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .cal-widget-head h2{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cal-widget-head h2 .icon-inline svg{width:16px;height:16px;color:var(--accent);}
  .cal-widget-sub{font-family:'Atkinson Hyperlegible';font-weight:400;font-size:0.78rem;color:var(--muted);}
  .cal-caret svg{transition:transform .2s ease;}
  .cal-caret.open svg{transform:rotate(180deg);}
  .cal-est{color:var(--accent-3);font-weight:700;cursor:help;}

  .mini-cal-nav{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .mini-cal-month{flex:1;text-align:center;font-size:0.92rem;font-weight:600;}
  .icon-btn.sm{width:28px;height:28px;}
  .icon-btn.sm svg{width:14px;height:14px;}
  .cal-today-btn{font-family:'Space Grotesk';font-size:0.72rem;color:var(--accent);cursor:pointer;
    border:1px solid var(--glass-border);border-radius:999px;padding:4px 12px;white-space:nowrap;
    transition:border-color .15s ease, background .15s ease;}
  .cal-today-btn:hover{border-color:var(--accent);background:rgba(139,124,246,0.1);}
  .cal-clear-day{color:var(--accent);cursor:pointer;font-weight:400;font-size:0.72rem;}

  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;}
  .mini-cal-dow{text-align:center;font-family:'Space Grotesk';font-size:0.68rem;color:var(--muted-dim);padding-bottom:4px;}
  .mini-cal-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-sm);font-size:0.78rem;color:var(--muted);background:rgba(255,255,255,0.03);
    cursor:pointer;transition:background .15s ease, box-shadow .15s ease;}
  .mini-cal-cell:not(.empty):hover{background:rgba(255,255,255,0.09);}
  .mini-cal-cell.empty{background:transparent;cursor:default;}
  .mini-cal-cell.today{background:rgba(139,124,246,0.22);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px rgba(139,124,246,0.55) inset;}
  .mini-cal-cell.selected{box-shadow:0 0 0 2px var(--accent) inset;color:var(--ink);}
  .mini-cal-cell.has-dot .mini-cal-num{margin-bottom:2px;}
  .mini-cal-dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent-3);}

  .cal-list{display:flex;flex-direction:column;gap:6px;}
  .cal-row{display:flex;align-items:flex-start;gap:12px;border-left:3px solid var(--block-color,#8B7CF6);
    background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    padding:8px 10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;cursor:pointer;
    transition:transform .15s ease, background .15s ease;}
  .cal-row:hover{transform:translateX(3px);background:linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));}
  .cal-row.past{opacity:0.5;}
  .cal-date{font-family:'Space Grotesk';font-size:0.72rem;color:var(--muted);min-width:56px;flex-shrink:0;padding-top:1px;}
  .cal-main{flex:1;}
  .cal-course{font-family:'Space Grotesk';font-size:0.72rem;font-weight:700;color:var(--muted);}
  .cal-item{font-size:0.85rem;margin-top:2px;}

  /* course grid — kanban-style cards */
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;}
  .course-card{position:relative;overflow:hidden;border:1px solid var(--glass-border);border-radius:var(--radius-md);
    padding:16px 16px 15px;cursor:pointer;background:linear-gradient(165deg, var(--glass-hi), var(--glass));
    transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease;}
  .course-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--card-color, #8B7CF6);}
  .course-card:hover{transform:translateY(-4px);border-color:var(--card-color, #8B7CF6);
    box-shadow:0 16px 34px -10px var(--card-color, #8B7CF6);}
  .course-card .code{font-family:'Space Grotesk';font-size:0.72rem;color:var(--muted);margin-top:4px;}
  .course-card .name{font-weight:700;margin:5px 0;font-size:1.05rem;}
  .course-card .instr{color:var(--muted);font-size:0.8rem;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:0.7rem;
    padding:3px 10px;border-radius:999px;font-family:'Space Grotesk';}
  .status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-pill.has{background:color-mix(in srgb, var(--card-color,#8B7CF6) 18%, transparent);
    color:var(--card-color,#8B7CF6);}
  .status-pill.none{background:rgba(255,255,255,0.06);color:var(--muted-dim);}

  /* course detail */
  .backlink{color:var(--muted);cursor:pointer;font-size:0.85rem;display:inline-flex;align-items:center;gap:6px;
    margin-bottom:4px;transition:color .15s ease;}
  .backlink svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .backlink:hover{color:var(--ink);}
  .course-header{padding:4px 2px 0;}
  .course-header h2{font-size:1.4rem;margin:0;}
  .course-header .meta{color:var(--muted);font-size:0.88rem;margin-top:4px;}
  .course-header .accent-dot{display:inline-block;width:10px;height:10px;border-radius:50%;
    background:var(--course-accent, #8B7CF6);margin-right:9px;box-shadow:0 0 12px var(--course-accent, #8B7CF6);}

  .tabs{display:inline-flex;gap:2px;background:linear-gradient(155deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);border-radius:999px;margin:18px 0 18px;padding:4px;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset;flex-wrap:wrap;}
  .tab{font-family:'Space Grotesk';font-size:0.83rem;padding:8px 15px;cursor:pointer;color:var(--muted);
    border-radius:999px;transition:background .18s ease, color .18s ease;}
  .tab.active{color:#0B0F2E;background:var(--course-accent, var(--accent));font-weight:600;}

  .lecture-block{border:1px solid var(--hairline);border-radius:var(--radius-md);padding:16px 17px;margin-bottom:13px;
    background:rgba(255,255,255,0.025);}
  .lecture-block h3{font-family:'Space Grotesk';font-size:1rem;margin:0 0 10px;color:var(--ink);}
  .concept-list{margin:0;padding-left:0;list-style:none;}
  .concept-list li{margin-bottom:9px;padding-left:16px;position:relative;}
  .concept-list li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
    background:var(--course-accent, #8B7CF6);}
  .concept-list b{color:var(--course-accent, #8B7CF6);font-weight:700;}

  .ws-list{margin:0;padding-left:0;list-style:none;}
  .ws-list li{margin-bottom:10px;padding-left:26px;position:relative;}
  .ws-list li::before{content:"—";position:absolute;left:0;color:var(--course-accent, #8B7CF6);font-weight:700;}

  /* worksheet bars */
  .ws-bar-list{display:flex;flex-direction:column;gap:10px;}
  .ws-bar{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;cursor:pointer;
    background:rgba(255,255,255,0.035);border:1px solid var(--hairline);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;}
  .ws-bar:hover{transform:translateX(3px);background:rgba(255,255,255,0.07);border-color:var(--course-accent, #8B7CF6);}
  .ws-bar-icon{flex-shrink:0;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.06);color:var(--course-accent, #8B7CF6);}
  .ws-bar-icon svg{width:18px;height:18px;}
  .ws-bar-text{flex:1;min-width:0;}
  .ws-bar-title{font-family:'Space Grotesk';font-size:0.92rem;font-weight:600;color:var(--ink);}
  .ws-bar-sub{font-size:0.76rem;color:var(--muted);margin-top:2px;}
  .ws-bar-chev{flex-shrink:0;color:var(--muted-dim);}
  .ws-bar-chev svg{width:16px;height:16px;}
  .ws-bar-ai{background:linear-gradient(120deg, rgba(139,92,246,0.14), rgba(6,182,212,0.08));
    border-color:rgba(139,92,246,0.35);}
  .ws-bar-ai .ws-bar-icon{background:linear-gradient(135deg, #8B5CF6, #06B6D4);color:#fff;}
  .ws-bar-ai:hover{border-color:#8B5CF6;}

  .ws-detail-head{margin-bottom:14px;}
  .panel-flush .ws-detail-head{padding:16px 18px 0;margin-bottom:0;}
  .panel-flush .lecture-block{margin:0 18px 18px;}

  table.syllabus{width:100%;border-collapse:collapse;font-size:0.85rem;}
  table.syllabus th,table.syllabus td{border-bottom:1px solid var(--hairline);padding:9px 7px;text-align:left;
    vertical-align:top;}
  table.syllabus th{color:var(--muted);font-family:'Space Grotesk';font-weight:600;font-size:0.74rem;}
  table.syllabus tr:hover td{background:rgba(255,255,255,0.03);}

  .eval-grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:0.9rem;}
  .eval-grid .v{color:var(--course-accent, #8B7CF6);font-family:'Space Grotesk';font-weight:600;text-align:right;}

  /* notes */
  .note-form{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap;}
  .note-form textarea{flex:1;min-width:200px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);color:var(--ink);font-family:inherit;font-size:0.92rem;padding:11px 13px;
    resize:vertical;min-height:46px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .note-form textarea:focus{outline:none;border-color:var(--course-accent, #8B7CF6);}
  .note-form button{font-family:'Space Grotesk';background:var(--course-accent, #8B7CF6);color:#0B0F2E;border:none;
    border-radius:999px;padding:0 20px;font-weight:700;cursor:pointer;font-size:0.85rem;
    transition:filter .15s ease, transform .15s ease;}
  .note-form button:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .note-item{border:1px solid var(--hairline);border-left:3px solid var(--course-accent, #8B7CF6);
    border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:9px;position:relative;
    background:rgba(255,255,255,0.02);}
  .note-item .when{color:var(--muted-dim);font-size:0.72rem;margin-bottom:5px;font-family:'Space Grotesk';}
  .note-item .del{position:absolute;top:11px;right:13px;color:var(--muted-dim);cursor:pointer;font-size:0.73rem;
    transition:color .15s ease;}
  .note-item .del:hover{color:var(--course-accent, #8B7CF6);}
  .no-notes{color:var(--muted-dim);font-style:italic;font-size:0.88rem;}
  .no-material{color:var(--muted-dim);font-style:italic;padding:16px 4px;}

  .footer-note{color:var(--muted-dim);font-size:0.78rem;text-align:center;margin-top:32px;}

  /* ---------- theme swatches ---------- */
  .theme-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .swatch{width:38px;height:38px;border-radius:50%;cursor:pointer;position:relative;flex:none;
    border:2px solid rgba(255,255,255,0.18);transition:transform .15s ease, border-color .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);}
  .swatch:hover{transform:translateY(-2px) scale(1.05);}
  .swatch.active{border-color:#fff;box-shadow:0 0 0 3px var(--accent), 0 4px 14px rgba(0,0,0,0.35);}
  .swatch-custom{display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--ink);
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));}
  input[type="color"].theme-color-input{-webkit-appearance:none;appearance:none;width:38px;height:38px;
    border:2px solid rgba(255,255,255,0.18);border-radius:50%;padding:0;cursor:pointer;background:none;}
  input[type="color"].theme-color-input::-webkit-color-swatch-wrapper{padding:0;border-radius:50%;}
  input[type="color"].theme-color-input::-webkit-color-swatch{border:none;border-radius:50%;}

  /* ---------- settings modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(4,6,18,0.55);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .modal{width:100%;max-width:560px;max-height:80vh;overflow-y:auto;
    background:linear-gradient(160deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);border-radius:var(--radius-lg);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset, 0 30px 70px -20px rgba(2,4,16,0.7);
    padding:22px 22px 24px;position:relative;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h2{margin:0;font-family:'Space Grotesk';font-size:1.15rem;}
  .modal-close{cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px;display:inline-flex;}
  .modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  .modal-close:hover{color:var(--ink);}
  .field-label{font-family:'Space Grotesk';font-size:0.78rem;color:var(--muted);margin:16px 0 7px;
    text-transform:none;}
  .field-label:first-child{margin-top:0;}
  .modal input[type="text"], .modal input[type="password"]{width:100%;background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--ink);
    font-family:inherit;font-size:0.9rem;padding:11px 13px;}
  .modal input:focus{outline:none;border-color:var(--accent);}
  .hint{color:var(--muted-dim);font-size:0.76rem;margin-top:6px;line-height:1.5;}
  .btn-primary{font-family:'Space Grotesk';background:var(--accent);color:#0B0F2E;border:none;
    border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:0.85rem;
    transition:filter .15s ease, transform .15s ease;}
  .btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .btn-ghost{font-family:'Space Grotesk';background:rgba(255,255,255,0.06);color:var(--ink);
    border:1px solid var(--glass-border);border-radius:999px;padding:9px 18px;font-weight:600;
    cursor:pointer;font-size:0.83rem;transition:background .15s ease;}
  .btn-ghost:hover{background:rgba(255,255,255,0.1);}

  .upload-drop{border:1.5px dashed var(--glass-border);border-radius:var(--radius-md);
    padding:22px 16px;text-align:center;color:var(--muted);cursor:pointer;font-size:0.85rem;
    transition:border-color .15s ease, background .15s ease;}
  .upload-drop:hover, .upload-drop.drag{border-color:var(--accent);background:rgba(255,255,255,0.04);}
  .upload-select{font-family:'Space Grotesk';background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);color:var(--ink);padding:9px 11px;font-size:0.85rem;width:100%;margin-top:10px;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,0.05);border:1px solid var(--hairline);border-radius:var(--radius-sm);
    padding:9px 12px;margin-top:9px;font-size:0.82rem;}
  .file-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-chip .status{color:var(--muted-dim);font-size:0.72rem;flex:none;}
  .file-chip .status.ok{color:var(--accent-2);}
  .file-chip .status.err{color:var(--accent-3);}
  .file-chip .rm{cursor:pointer;color:var(--muted-dim);flex:none;display:inline-flex;}
  .file-chip .rm svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  .file-chip .rm:hover{color:var(--ink);}
  .ai-log{margin-top:12px;font-size:0.78rem;color:var(--muted-dim);max-height:120px;overflow-y:auto;
    border-top:1px solid var(--hairline);padding-top:10px;}
  .ai-log div{margin-bottom:4px;}
  .settings-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    padding:10px 18px;border-radius:999px;font-size:0.82rem;box-shadow:0 12px 30px rgba(0,0,0,0.4);
    animation:riseIn .3s ease both;}
</style>

/* =========================================================================
   STORAGE SHIM — window.storage only exists inside Claude's artifact host.
   Opened as a plain local file (file://, content://, downloaded HTML) it
   won't be defined, so everything here falls back to localStorage in that
   case. Same get/set/delete/list shape either way, so the rest of the app
   never needs to know which backend is active.
   ========================================================================= */
const LS_PREFIX = 'schoolcenter_fallback__';
const hasHostStorage = typeof window.storage === 'object' && window.storage !== null
  && typeof window.storage.get === 'function';

const storage = {
  async get(key, shared){
    if(hasHostStorage){
      try{ return await window.storage.get(key, shared); }
      catch(e){ /* fall through to localStorage below */ }
    }
    try{
      const raw = localStorage.getItem(LS_PREFIX+key);
      return raw === null ? null : { key, value: raw, shared: !!shared };
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(hasHostStorage){
      try{ return await window.storage.set(key, value, shared); }
      catch(e){ /* fall through to localStorage below */ }
    }
    try{
      localStorage.setItem(LS_PREFIX+key, value);
      return { key, value, shared: !!shared };
    }catch(e){ return null; }
  },
  async delete(key, shared){
    if(hasHostStorage){
      try{ return await window.storage.delete(key, shared); }
      catch(e){ /* fall through to localStorage below */ }
    }
    try{
      localStorage.removeItem(LS_PREFIX+key);
      return { key, deleted:true, shared: !!shared };
    }catch(e){ return null; }
  }
};

function decodeB64Utf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

}

function hexToRgb(hex){
  hex = hex.replace('#','');
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(hexA,hexB,t){
  const a=hexToRgb(hexA), b=hexToRgb(hexB);
  return rgbToHex(a.r+(b.r-a.r)*t, a.g+(b.g-a.g)*t, a.b+(b.b-a.b)*t);
}
function darken(hex, amt){ return mix(hex, '#000000', amt); }
function lighten(hex, amt){ return mix(hex, '#ffffff', amt); }

function buildCustomTheme(accentHex){
  return {
    key:'custom',
    ink:'#F4F6FD', muted:'#AEB4D8', mutedDim:'#7C82A6',
    accent:accentHex,
    accent2:lighten(accentHex,0.28),
    accent3:mix(accentHex,'#F0608A',0.5),
    bg1:darken(accentHex,0.86),
    bg2:darken(accentHex,0.78),
    bg3:darken(accentHex,0.68),
    lava:[accentHex, darken(accentHex,0.35), lighten(accentHex,0.22), darken(accentHex,0.6)],
    accentHex
  };
}

/* =========================================================================
   INTERACTIVE LAVA LAMP — metaball-style blobs on canvas, using a threshold
   render pass so overlapping circles fuse into soft, gooey lava-lamp shapes.
   Pointer position gently attracts/perturbs nearby blobs.
   ========================================================================= */
function createLavaEngine(canvas){
  const ctx = canvas.getContext('2d', { alpha:false });
  let W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  let blobs=[];
  let colors=['#8B7CF6','#5B4FD6','#B892FF','#3A2E7A'];
  let pointer={x:-9999,y:-9999,active:false};
  let raf=null;
  let reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function initBlobs(n){
    blobs = [];
    for(let i=0;i<n;i++){
      const r = 90 + Math.random()*160;
      blobs.push({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18,
        r, baseR:r,
        c: colors[i % colors.length],
        phase: Math.random()*Math.PI*2
      });
    }
  }
  function setColors(newColors){
    colors = newColors;
    blobs.forEach((b,i)=>{ b.c = colors[i % colors.length]; });
  }
  function step(t){
    ctx.clearRect(0,0,W,H);

    // background gradient wash beneath blobs for depth (kept subtle; body bg still shows through container)
    const grad = ctx.createLinearGradient(0,0,W,H);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    ctx.filter = 'blur(38px)';
    blobs.forEach(b=>{
      b.phase += 0.004;
      b.r = b.baseR * (1 + Math.sin(b.phase)*0.08);

      if(pointer.active){
        const dx = b.x - pointer.x, dy = b.y - pointer.y;
        const dist = Math.hypot(dx,dy) || 1;
        const influence = Math.max(0, 1 - dist/320);
        if(influence>0){
          b.vx += (dx/dist) * influence * 0.02;
          b.vy += (dy/dist) * influence * 0.02;
        }
      }

      b.x += b.vx; b.y += b.vy;
      b.vx *= 0.995; b.vy *= 0.995;
      const margin = b.r*0.4;
      if(b.x < -margin){ b.x=-margin; b.vx*=-1; }
      if(b.x > W+margin){ b.x=W+margin; b.vx*=-1; }
      if(b.y < -margin){ b.y=-margin; b.vy*=-1; }
      if(b.y > H+margin){ b.y=H+margin; b.vy*=-1; }
      // gentle drift so blobs never fully stop
      if(Math.hypot(b.vx,b.vy) < 0.03){
        b.vx += (Math.random()-0.5)*0.02;
        b.vy += (Math.random()-0.5)*0.02;
      }

      const rg = ctx.createRadialGradient(b.x,b.y,0, b.x,b.y,b.r);
      rg.addColorStop(0, b.c);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fill();
    });
    ctx.filter = 'none';

    if(!reduced) raf = requestAnimationFrame(step);
  }
  function start(){
    resize();
    if(!blobs.length) initBlobs(6);
    cancelAnimationFrame(raf);
    if(reduced){ step(0); return; } // draw one static frame, respect reduced motion
    raf = requestAnimationFrame(step);
  }
  window.addEventListener('resize', ()=>{ resize(); });
  window.addEventListener('pointermove', (e)=>{ pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true; });
  window.addEventListener('pointerleave', ()=>{ pointer.active=false; });
  window.addEventListener('pointerdown', (e)=>{
    // click gives a little "lava lamp jostle" impulse to nearby blobs
    blobs.forEach(b=>{
      const dx=b.x-e.clientX, dy=b.y-e.clientY;
      const dist=Math.hypot(dx,dy)||1;
      if(dist<260){
        const f = (1-dist/260)*1.6;
        b.vx += (dx/dist)*f; b.vy += (dy/dist)*f;
      }
    });
  });

  return { start, setColors, resize };
}

   deadlines, just grouped under "no date yet" instead of on the timeline.
   ========================================================================= */
const MONTH_NAMES = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function parseSyllabusDate(str){
  if(!str) return null;
  const m = String(str).trim().toLowerCase().match(/^([a-z]{3,})\s+(\d{1,2})$/);
  if(!m) return null;
  const monthIdx = MONTH_NAMES.findIndex(mn=>m[1].startsWith(mn));
  if(monthIdx===-1) return null;
  const day = parseInt(m[2],10);
  // Academic-year heuristic: Sep–Dec belongs to the current calendar year,
  // Jan–Aug belongs to next year (handles fall terms spilling into winter).
  const now = new Date();
  const year = monthIdx>=8 ? now.getFullYear() : now.getFullYear()+1;
  const d = new Date(year, monthIdx, day);
  return isNaN(d.getTime()) ? null : d;
}

// Term calendar, taken from MATH15325D's confirmed dated syllabus (the one
// course with real dates): week 1 = Mon Sep 7 2026, one week per row,
// with Oct 26 2026 as reading week (no numbered week that week).
const TERM_START = new Date(2026, 8, 7); // Sep 7 2026 (Mon)
const READING_WEEK_START = new Date(2026, 9, 26); // Oct 26 2026

function estimateDateForWeek(weekNum){
  const n = parseInt(weekNum, 10);
  if(isNaN(n) || n<1) return null;
  const d = new Date(TERM_START);
  d.setDate(d.getDate() + (n-1)*7);
  if(d >= READING_WEEK_START) d.setDate(d.getDate()+7); // skip reading week
  return d;
}

function collectDeadlines(){
  const dated = [];
  COURSES.forEach(c=>{
    (c.syllabus||[]).forEach(row=>{
      const [wk, dateStr, topics, classwork] = row;
      if(!classwork || !classwork.trim()) return;
      let date = parseSyllabusDate(dateStr);
      let estimated = false;
      if(!date && wk && wk!=='—' && !isNaN(parseInt(wk,10))){
        date = estimateDateForWeek(wk);
        estimated = true;
      }
      if(!date) return; // no usable date at all — nothing to estimate from
      dated.push({ course:c, week:wk, dateStr, topics, classwork, date, estimated });
    });
  });
  dated.sort((a,b)=>a.date-b.date);
  return { dated };
}

const API_KEY_STORAGE = 'schoolcenter_ai_key_v1';

/* "Failed to fetch" from the browser means the request never reached the
   server at all — almost always a network/CORS/permissions block rather
   than anything wrong with the key itself. Turn that opaque error into
   something the user can actually act on. */
function diagnoseFetchFailure(err){
  const isOpenedAsFile = location.protocol === 'file:' || location.protocol === 'content:';
  const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
  if(offline){
    return 'You appear to be offline — check your internet connection and try again.';
  }
  if(isOpenedAsFile){
    return `Request never left the browser ("${err.message}"). This usually happens when the page is opened directly as a local file (${location.protocol}//…) — some mobile browsers block network requests from local files entirely. Try opening this file in a full browser tab (not a file-manager preview), or open it through the Claude app/artifact view instead.`;
  }
  return `Request never reached Google's servers ("${err.message}"). This is usually a network/ad-blocker/VPN issue rather than the key itself — try a different network or disable any content blockers, then test again.`;
}

async function loadApiKey(){
  try{
    const res = await storage.get(API_KEY_STORAGE, false);
    return res && res.value ? res.value : '';
  }catch(e){ return ''; }
}
async function saveApiKey(key){
  try{ await storage.set(API_KEY_STORAGE, key, false); }
  catch(e){ console.error('Could not save API key', e); }
}

async function handleFiles(fileListRaw){
  const files = Array.from(fileListRaw || []);
  for(const f of files){
    let text = '';
    let pdfBase64 = null;
    let status = 'ready';
    let errMsg = '';
    try{
      if(f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')){
        pdfBase64 = await fileToBase64(f);
        if(!pdfBase64) throw new Error('Empty result reading PDF');
      } else {
        text = await f.text();
      }
    }catch(e){
      status = 'error';
      errMsg = (e && e.message) || 'unknown read error';
      logAI(`Couldn't read ${f.name}: ${errMsg}`);
    }
    pendingFiles.push({ name:f.name, text, pdfBase64, status, errMsg, courseId: document.getElementById('target-course').value });
  }
  renderFileList();
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    try{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result.split(',')[1]);
      reader.onerror = ()=> reject(reader.error || new Error('Could not read file'));
      reader.onabort = ()=> reject(new Error('File read aborted'));
      reader.readAsDataURL(file);
    }catch(syncErr){
      reject(syncErr);
    }
  });
}

/* Calls the AI API directly from the browser with the user's own key to turn
   raw uploaded text into structured lecture/worksheet/syllabus/note data,
   then merges it into the matching course — without touching anything the
   user already has (existing lectures/worksheets/notes are kept, new items
   are appended). */
let isProcessingFiles = false;

async function processFilesWithAI(){
  if(isProcessingFiles) return;
  const apiKey = await loadApiKey();
  if(!apiKey){
    logAI('No Gemini API key saved yet — paste one above and tap "Save key" first.');
    return;
  }
  const todo = pendingFiles.filter(f=>f.status==='ready' && (f.text || f.pdfBase64));
  if(!todo.length){
    const debugInfo = pendingFiles.map(f=>`${f.name}: status=${f.status}, hasText=${!!f.text}, hasPdf=${!!f.pdfBase64}`).join(' | ');
    logAI(pendingFiles.length
      ? `No readable files to process. Debug — ${debugInfo}`
      : 'No files added yet — drop a file or tap the upload area above first.');
    return;
  }
  isProcessingFiles = true;
  const processBtn = document.getElementById('process-files-btn');
  if(processBtn){ processBtn.disabled = true; processBtn.textContent = 'Processing…'; }
  logAI(`Starting (trying ${GEMINI_MODEL_CANDIDATES.join(' → ')})…`);

  for(const f of todo){
    f.status = 'processing';
    renderFileList();
    logAI(`Reading ${f.name}…`);
    try{
      const course = courseById(f.courseId);
      const structured = await extractStructuredData(apiKey, { text: f.text, pdfBase64: f.pdfBase64 }, course);
      mergeIntoCourse(course, structured);
      f.status = 'done';
      logAI(`Added ${summarizeMerge(structured)} to ${course.code} from ${f.name}.`);
    }catch(e){
      f.status = 'error';
      logAI(`Couldn't process ${f.name}: ${e.message || 'unknown error'}`);
    }
    renderFileList();
  }
  isProcessingFiles = false;
  if(processBtn) processBtn.disabled = false;
  render();
  showToast('Course materials updated');
}

function summarizeMerge(s){
  const parts = [];
  if(s.lectures && s.lectures.length) parts.push(`${s.lectures.length} lecture${s.lectures.length>1?'s':''}`);
  if(s.worksheets && s.worksheets.length) parts.push(`${s.worksheets.length} worksheet${s.worksheets.length>1?'s':''}`);
  if(s.notes && s.notes.length) parts.push(`${s.notes.length} note${s.notes.length>1?'s':''}`);
  if(s.syllabus && s.syllabus.length) parts.push('a syllabus');
  return parts.length ? parts.join(', ') : 'no new content';
}

// Google periodically retires Gemini model names. Try the current lineup in
// order and fall back automatically so one deprecation doesn't break the app.
const GEMINI_MODEL_CANDIDATES = ['gemini-3.8-flash', 'gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-2.5-flash'];

async function callGeminiWithFallback(apiKey, bodyJson){
  let lastRes = null, lastData = null;
  for(const model of GEMINI_MODEL_CANDIDATES){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
    let res;
    try{
      res = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: bodyJson });
    }catch(networkErr){
      throw new Error(diagnoseFetchFailure(networkErr));
    }
    if(res.ok){
      return { res, data: await res.json(), model };
    }
    const data = await res.json().catch(()=>null);
    const msg = (data && data.error && data.error.message) || '';
    lastRes = res; lastData = data;
    // "no longer available" / model-not-found errors: try the next candidate.
    // Any other error (bad key, quota, etc.) — stop and surface it immediately.
    const isModelGone = res.status === 404 || /no longer available|not found|not supported/i.test(msg);
    if(!isModelGone) break;
  }
  return { res: lastRes, data: lastData, model: null };
}

async function extractStructuredData(apiKey, input, course){
  const system = `You convert raw course-material text into structured JSON for a student's course tracker.
Respond with ONLY valid JSON, no prose, no markdown fences, matching exactly this shape:
{
  "lectures": [ { "title": "string", "concepts": [["term","definition"], ...] } ],
  "worksheets": [ { "title": "string", "items": ["string", ...] } ],
  "notes": [ "string", ... ],
  "syllabus": [ ["week","date","topics","classwork"], ... ],
  "evaluation": [ ["component","weight"], ... ],
  "textbook": "string or empty"
}
Only include keys where the source text actually has that kind of content — omit or leave empty arrays otherwise. Keep entries concise and faithful to the source; do not invent facts not present in the text.`;

  const parts = [];
  if(input.pdfBase64){
    parts.push({ inline_data: { mime_type: 'application/pdf', data: input.pdfBase64 } });
    parts.push({ text: `Course: ${course.code} — ${course.name}\n\nExtract the structured data from this PDF course material.` });
  } else {
    const userMsg = `Course: ${course.code} — ${course.name}\n\nRaw material:\n"""\n${(input.text||'').slice(0, 12000)}\n"""`;
    parts.push({ text: userMsg });
  }

  const body = JSON.stringify({
    systemInstruction: { parts:[{ text: system }] },
    contents:[{ role:'user', parts }],
    generationConfig:{
      temperature:0.2,
      maxOutputTokens:2000,
      responseMimeType:'application/json'
    }
  });

  const { res, data } = await callGeminiWithFallback(apiKey, body);
  if(!res.ok){
    const msg = data && data.error && data.error.message ? data.error.message : `HTTP ${res.status}`;
    throw new Error(msg.slice(0,160));
  }
  const candidate = (data.candidates||[])[0];
  const part = candidate && candidate.content && candidate.content.parts && candidate.content.parts[0];
  if(!part || !part.text) throw new Error('No text in response');
  const cleaned = part.text.replace(/```json|```/g,'').trim();
  return JSON.parse(cleaned);
}

function mergeIntoCourse(course, structured){
  if(structured.lectures && structured.lectures.length){
    course.lectures = (course.lectures||[]).concat(structured.lectures);
    course.hasMaterial = true;
  }
  if(structured.worksheets && structured.worksheets.length){
    course.worksheets = (course.worksheets||[]).concat(structured.worksheets);
    course.hasMaterial = true;
  }
  if(structured.syllabus && structured.syllabus.length){
    course.syllabus = (course.syllabus||[]).concat(structured.syllabus);
  }
  if(structured.evaluation && structured.evaluation.length && !course.evaluation){
    course.evaluation = structured.evaluation;
  }
  if(structured.textbook && !course.textbook){
    course.textbook = structured.textbook;
  }
  if(structured.notes && structured.notes.length){
    // fire-and-forget append into the persisted notes store for this course
    loadNotes(course.id).then(existing=>{
      const now = Date.now();
      const additions = structured.notes.map((t,i)=>({ id:'n'+(now+i), text:t, createdAt: now+i }));
      saveNotes(course.id, existing.concat(additions));
    });
  }
}

let calendarExpanded = false;
let practiceStudioOpen = false;
let calendarViewMonth = null; // {year, month} — null means "current month"
let calendarSelectedDay = null; // toDateString() key, or null = show whole month's agenda

function renderCalendarPanel(){
  const { dated } = collectDeadlines();
  const today = new Date(); today.setHours(0,0,0,0);
  const horizonEnd = new Date(today); horizonEnd.setDate(horizonEnd.getDate()+30);
  const next30 = dated.filter(d=>d.date>=today && d.date<horizonEnd);

  const viewYear = calendarViewMonth ? calendarViewMonth.year : today.getFullYear();
  const viewMonth = calendarViewMonth ? calendarViewMonth.month : today.getMonth();
  const monthDeadlines = dated.filter(d=>d.date.getFullYear()===viewYear && d.date.getMonth()===viewMonth);
  const deadlineDayKeys = new Set(monthDeadlines.map(d=>d.date.toDateString()));

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const startPad = firstOfMonth.getDay(); // 0=Sun
  const cells = [];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let i=1;i<=daysInMonth;i++) cells.push(new Date(viewYear, viewMonth, i));

  const gridHtml = cells.map(d=>{
    if(!d) return `<div class="mini-cal-cell empty"></div>`;
    const key = d.toDateString();
    const isToday = key===today.toDateString();
    const isSelected = key===calendarSelectedDay;
    const hasDeadline = deadlineDayKeys.has(key);
    return `<div class="mini-cal-cell ${isToday?'today':''} ${hasDeadline?'has-dot':''} ${isSelected?'selected':''}" data-daykey="${key}" title="${d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}">
      <span class="mini-cal-num">${d.getDate()}</span>${hasDeadline?'<span class="mini-cal-dot"></span>':''}
    </div>`;
  }).join('');

  // Agenda: either the selected day's items, or (if no day selected) the
  // next-30-days rolling view so the widget stays useful across month edges.
  const showingDay = !!calendarSelectedDay;
  const agendaSource = showingDay
    ? dated.filter(d=>d.date.toDateString()===calendarSelectedDay)
    : next30;
  const agendaHtml = agendaSource.length ? agendaSource.map(d=>`
    <div class="cal-row" data-course="${d.course.id}" style="--block-color:${d.course.accent}">
      <div class="cal-date">${d.date.toLocaleDateString(undefined,{month:'short',day:'numeric'})}${d.estimated?' <span class="cal-est" title="Estimated from module/week number — no exact date given in the outline">~</span>':''}</div>
      <div class="cal-main">
        <div class="cal-course">${d.course.code}</div>
        <div class="cal-item">${d.classwork}</div>
      </div>
    </div>`).join('') : `<div class="empty-day">${showingDay ? 'Nothing due this day.' : 'Nothing due in the next 30 days.'}</div>`;

  const hasEstimates = agendaSource.some(d=>d.estimated);
  const isCurrentMonth = viewYear===today.getFullYear() && viewMonth===today.getMonth();
  const monthLabel = firstOfMonth.toLocaleDateString(undefined,{month:'long', year:'numeric'});

  return `
    <div class="panel cal-widget">
      <div class="cal-widget-head" id="cal-widget-toggle">
        <h2 class="headfont">${icon('calendar')} Calendar <span class="cal-widget-sub">next 30 days · ${next30.length} due</span></h2>
        <div class="icon-btn cal-caret ${calendarExpanded?'open':''}">${icon('chevronDown')}</div>
      </div>
      ${calendarExpanded ? `
        <div class="mini-cal-nav">
          <div class="icon-btn sm" id="cal-prev-month">${icon('chevronLeft')}</div>
          <div class="mini-cal-month headfont">${monthLabel}</div>
          <div class="icon-btn sm" id="cal-next-month">${icon('chevronRight')}</div>
          ${!isCurrentMonth || calendarSelectedDay ? `<div class="cal-today-btn" id="cal-jump-today">Today</div>` : ''}
        </div>
        <div class="mini-cal-grid">
          ${['S','M','T','W','T','F','S'].map(d=>`<div class="mini-cal-dow">${d}</div>`).join('')}
          ${gridHtml}
        </div>
        <div class="dim-divider">${showingDay ? new Date(calendarSelectedDay).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}) : 'Next 30 days'}${showingDay ? ` <span class="cal-clear-day" id="cal-clear-day">(show all)</span>` : ''}</div>
        <div class="cal-list">${agendaHtml}</div>
        ${hasEstimates ? `<div class="hint" style="margin-top:8px;">~ estimated from the course's module/week number — the outline didn't give an exact calendar date.</div>` : ''}
      ` : ''}
    </div>`;
}

function renderDashboard(){
  const dayCols = DAYS.map((d,i)=>{
    const blocks = [];
    COURSES.forEach(c=>{
      (c.schedule||[]).filter(s=>s.day===d).forEach(s=>{
        blocks.push(`<div class="block" data-course="${c.id}" style="--block-color:${c.accent}">
          <div class="t">${s.start}\u2013${s.end} · ${s.type}${s.room?(' · '+s.room):''}</div>
          <div class="c">${c.code}</div>
        </div>`);
      });
    });
    return `<div class="day-col ${i===TODAY_IDX?'is-today':''}">
      <div class="day-name">${d}</div>
      ${blocks.length ? blocks.join('') : '<div class="empty-day">No campus classes</div>'}
    </div>`;
  }).join('');

  const loadedCount = COURSES.filter(c=>c.hasMaterial).length;
  const progressSegs = COURSES.map(c=>`<div class="progress-seg ${c.hasMaterial?'on':''}" style="--seg-color:${c.accent}"></div>`).join('');

  const courseCards = COURSES.map((c,i)=>`
    <div class="course-card enter" data-course="${c.id}" style="--card-color:${c.accent}; animation-delay:${i*45}ms">
      <div class="code">${c.code}</div>
      <div class="name">${c.name}</div>
      <div class="instr">${c.instructor && c.instructor!=='—' ? c.instructor : 'Async · Slate Online'}</div>
      <span class="status-pill ${c.hasMaterial?'has':'none'}">${c.hasMaterial?'Materials loaded':'No materials yet'}</span>
    </div>
  `).join('');

  return `
    <div class="topbar">
      <div>
        <h1 class="headfont">School Center</h1>
        <div class="sub">Abdullah Massraf · Fall 2026 · Honours B.Eng (Mechanical)</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="progress-pill"><div class="progress-track">${progressSegs}</div>${loadedCount} of ${COURSES.length} courses loaded</div>
        <div class="today-badge headfont">${new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})}</div>
        <div class="icon-btn" id="open-settings" title="Theme & AI settings">${icon('gear')}</div>
      </div>
    </div>

    <div class="panel">
      <h2 class="headfont">This week</h2>
      <div class="week-grid">${dayCols}</div>
    </div>

    ${renderCalendarPanel()}

    <div class="panel">
      <h2 class="headfont">Courses</h2>
      <div class="course-grid">${courseCards}</div>
    </div>

    <div class="footer-note">Click a course to open its workspace — lectures, worksheets, and tutoring notes.</div>
  `;
}

function renderCourse(c){
  const tabs = ['lectures','worksheets','syllabus','notes'];
  const tabLabel = {lectures:'Lectures', worksheets:'Worksheets', syllabus:'Course Outline', notes:'Tutor Notes'};

  let body = '';
  let flush = false;
  if(state.tab==='lectures'){
    if(!c.hasMaterial){
      body = `<div class="no-material">No lecture material uploaded for ${c.name} yet.</div>`;
    } else {
      body = c.lectures.map(l=>`
        <div class="lecture-block">
          <h3>${l.title}</h3>
          <ul class="concept-list">
            ${l.concepts.map(([term,def])=>`<li><b>${term}</b> — ${def}</li>`).join('')}
          </ul>
        </div>
      `).join('');
    }
  } else if(state.tab==='worksheets'){
    const hasAnyWorksheets = (c.hasMaterial && c.worksheets.length) || c.hasPracticeStudio;
    if(!hasAnyWorksheets){
      body = `<div class="no-material">No worksheets uploaded for ${c.name} yet.</div>`;
    } else if(state.worksheetView===null){
      // Bar list — one rounded bar per worksheet, plus the AI practice studio if this course has one.
      const bars = [];
      if(c.hasPracticeStudio){
        bars.push(`
          <div class="ws-bar ws-bar-ai" data-worksheet="ai-studio">
            <div class="ws-bar-icon">${icon('spark')}</div>
            <div class="ws-bar-text">
              <div class="ws-bar-title">AI Practice Studio</div>
              <div class="ws-bar-sub">Worked examples + step-by-step practice, generated with AI</div>
            </div>
            <div class="ws-bar-chev">${icon('chevronRight')}</div>
          </div>`);
      }
      c.worksheets.forEach((w,i)=>{
        bars.push(`
          <div class="ws-bar" data-worksheet="${i}">
            <div class="ws-bar-icon">${icon('doc')}</div>
            <div class="ws-bar-text">
              <div class="ws-bar-title">${w.title}</div>
              <div class="ws-bar-sub">${w.items.length} problem${w.items.length===1?'':'s'}</div>
            </div>
            <div class="ws-bar-chev">${icon('chevronRight')}</div>
          </div>`);
      });
      body = `<div class="ws-bar-list">${bars.join('')}</div>`;
    } else {
      const w = c.worksheets[state.worksheetView];
      body = `
        <div class="ws-detail-head">
          <div class="backlink" id="ws-back">${icon('arrowLeft')} Back to worksheets</div>
        </div>
        <div class="lecture-block">
          <h3>${w.title}</h3>
          <ul class="ws-list">${w.items.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>
      `;
    }
  } else if(state.tab==='syllabus'){
    if(!c.syllabus){
      body = `<div class="no-material">No course outline uploaded for ${c.name} yet.</div>`;
    } else {
      body = `
        ${c.evaluation ? `
        <div class="lecture-block">
          <h3>Evaluation</h3>
          <div class="eval-grid">
            ${c.evaluation.map(([k,v])=>`<div>${k}</div><div class="v">${v}</div>`).join('')}
          </div>
          ${c.textbook ? `<div class="dim-divider">Textbook</div><div>${c.textbook}</div>` : ''}
        </div>` : ''}
        <div class="lecture-block">
          <h3>Weekly Topics</h3>
          <table class="syllabus">
            <tr><th>Wk</th><th>Week of</th><th>Topics</th><th>Classwork</th></tr>
            ${c.syllabus.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
          </table>
        </div>
      `;
    }
  } else if(state.tab==='notes'){
    body = `
      <div class="note-form">
        <textarea id="note-input" placeholder="Add a note from today's tutoring session..."></textarea>
        <button id="note-add">Save note</button>
      </div>
      <div id="notes-list">Loading notes…</div>
    `;
  }

  return `
    <div style="--course-accent:${c.accent}">
      <div class="topbar">
        <div class="backlink" id="back-btn">${icon('arrowLeft')} Back to dashboard</div>
      </div>
      <div class="course-header">
        <h2 class="headfont"><span class="accent-dot"></span>${c.code} — ${c.name}</h2>
        <div class="meta">${c.instructor && c.instructor!=='—' ? c.instructor : 'Async · Slate Online'}</div>
      </div>
      <div class="tabs">
        ${tabs.map(t=>`<div class="tab ${state.tab===t?'active':''}" data-tab="${t}">${tabLabel[t]}</div>`).join('')}
      </div>
      <div class="panel ${flush?'panel-flush':''}">${body}</div>
    </div>
  `;
}

async function loadNotes(courseId){
  try{
    const res = await storage.get(`notes:${courseId}`, false);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}
async function saveNotes(courseId, notes){
  try{
    await storage.set(`notes:${courseId}`, JSON.stringify(notes), false);
  }catch(e){
    console.error('Could not save notes', e);
  }
}

async function renderNotesList(courseId){
  const list = document.getElementById('notes-list');
  if(!list) return;
  const notes = await loadNotes(courseId);
  if(!notes.length){
    list.innerHTML = `<div class="no-notes">No tutor notes yet for this course. Notes you and your tutor add here will stay saved.</div>`;
    return;
  }
  list.innerHTML = notes.slice().reverse().map(n=>`
    <div class="note-item" data-id="${n.id}">
      <div class="del" data-del="${n.id}">remove</div>
      <div class="when">${new Date(n.createdAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
      <div>${n.text.replace(/</g,'&lt;')}</div>
    </div>
  `).join('');

  list.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.getAttribute('data-del');
      const cur = await loadNotes(courseId);
      const next = cur.filter(n=>n.id!==id);
      await saveNotes(courseId, next);
      renderNotesList(courseId);
    });
  });
}

function attachHandlers(){
  const settingsBtn = document.getElementById('open-settings');
  if(settingsBtn) settingsBtn.addEventListener('click', openSettings);

  document.querySelectorAll('[data-worksheet]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const v = el.getAttribute('data-worksheet');
      if(v==='ai-studio'){
        practiceStudioOpen = true;
      } else {
        state.worksheetView = parseInt(v,10);
      }
      render();
    });
  });
  const wsBack = document.getElementById('ws-back');
  if(wsBack) wsBack.addEventListener('click', ()=>{
    state.worksheetView = null;
    render();
  });

  const calToggle = document.getElementById('cal-widget-toggle');
  if(calToggle) calToggle.addEventListener('click', ()=>{
    calendarExpanded = !calendarExpanded;
    if(!calendarExpanded){ calendarViewMonth = null; calendarSelectedDay = null; }
    render();
  });

  const calPrev = document.getElementById('cal-prev-month');
  if(calPrev) calPrev.addEventListener('click', (e)=>{
    e.stopPropagation();
    const today = new Date();
    const cur = calendarViewMonth || { year: today.getFullYear(), month: today.getMonth() };
    let { year, month } = cur;
    month--; if(month<0){ month=11; year--; }
    calendarViewMonth = { year, month };
    calendarSelectedDay = null;
    render();
  });
  const calNext = document.getElementById('cal-next-month');
  if(calNext) calNext.addEventListener('click', (e)=>{
    e.stopPropagation();
    const today = new Date();
    const cur = calendarViewMonth || { year: today.getFullYear(), month: today.getMonth() };
    let { year, month } = cur;
    month++; if(month>11){ month=0; year++; }
    calendarViewMonth = { year, month };
    calendarSelectedDay = null;
    render();
  });
  const calJumpToday = document.getElementById('cal-jump-today');
  if(calJumpToday) calJumpToday.addEventListener('click', (e)=>{
    e.stopPropagation();
    calendarViewMonth = null;
    calendarSelectedDay = null;
    render();
  });
  const calClearDay = document.getElementById('cal-clear-day');
  if(calClearDay) calClearDay.addEventListener('click', (e)=>{
    e.stopPropagation();
    calendarSelectedDay = null;
    render();
  });
  document.querySelectorAll('.mini-cal-cell[data-daykey]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-daykey');
      calendarSelectedDay = calendarSelectedDay===key ? null : key;
      render();
    });
  });

  document.querySelectorAll('[data-course]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state = { view:'course', courseId: el.getAttribute('data-course'), tab:'lectures', worksheetView:null };
      render();
    });
  });
  const back = document.getElementById('back-btn');
  if(back) back.addEventListener('click', ()=>{ state = { view:'dashboard', courseId:null, tab:'lectures', worksheetView:null }; render(); });

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.tab = el.getAttribute('data-tab');
      state.worksheetView = null;
      render();
    });
  });

  if(state.view==='course' && state.tab==='notes'){
    renderNotesList(state.courseId);
    const addBtn = document.getElementById('note-add');
    if(addBtn){
      addBtn.addEventListener('click', async ()=>{
        const input = document.getElementById('note-input');
        const text = input.value.trim();
        if(!text) return;
        const notes = await loadNotes(state.courseId);
        notes.push({ id: 'n'+Date.now(), text, createdAt: Date.now() });
        await saveNotes(state.courseId, notes);
        input.value = '';
        renderNotesList(state.courseId);
      });
    }
  }
}

(async function init(){
  lavaEngine = createLavaEngine(document.getElementById('lava-canvas'));
  const theme = await loadTheme();
  applyTheme(theme); // also seeds lavaEngine colors before start
  lavaEngine.start();
  render();
})();
</script>
</body>
