     Sheridan College · Davis Campus · 7899 McLaughlin Rd, Brampton, ON L6Y 5H9
     Single-file Three.js (r160) digital twin — v4 performance build. Drop-in: no build step.
     Pond seating uses a CC0 cast-iron + timber park bench from 3DAssets.dev: https://3dassets.dev/assets/botanical-glasshouse-and-palm-house-botanical-glasshou-11a89546

     Host-page integration (all optional):
       window.DAVIS_TWIN_CONFIG = { accent:'#7c6cff', season:'auto', weather:'live', quality:'auto', building:'H' }  // before this script
       URL params: ?accent=%2300e5ff&building=H&season=winter&weather=rain&time=2026-09-20T21:30:00-04:00&debug
       JS API:     DavisTwin.select('H'), .setAccent('#0ff'), .setTime(dateOrMs|'live'), .setWeather('rain'),
                   .setSeason('winter'), .showRoute('H'), .reset(), .drive(), .on('select', fn)
       postMessage: parent.postMessage({type:'campus:select', id:'H'}, '*')

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --accent:#7c6cff;
    --bg:#070914;
    --ink:#e9ecff;
    --ink-dim:rgba(233,236,255,.62);
    --glass:rgba(13,15,34,.62);
    --line:rgba(255,255,255,.09);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
  #scene.grabbing{cursor:grabbing}
  #scene.hover{cursor:pointer}
  
  .glass{background:rgba(14,16,36,.86);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .hud{position:absolute;z-index:5}

  /* title */
  #title{top:calc(14px + var(--safe-t));left:14px;padding:12px 16px 12px 14px;border-radius:16px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 90px)}
  #title .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#22d3ee);display:grid;place-items:center;font-size:15px;color:#fff;flex:none}
  #title h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em}
  #title p{margin:2px 0 0;font-size:11.5px;color:var(--ink-dim)}
  #title .aaa{margin-left:7px;padding:2px 6px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 55%,rgba(255,255,255,.18));background:color-mix(in srgb,var(--accent) 16%,rgba(7,9,20,.65));font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;vertical-align:1px}

  /* panel */
  #panelBtn{top:calc(14px + var(--safe-t));right:14px;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:16px}

  #panel{top:calc(66px + var(--safe-t));right:14px;width:304px;max-height:calc(100% - 150px - var(--safe-t));overflow:auto;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;transition:opacity .2s,transform .25s}
  #panel.closed{opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none}
  #panel h3{margin:0 0 7px;font-size:11.5px;font-weight:600;color:var(--ink-dim);display:flex;justify-content:space-between;align-items:center}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button,.btn{font:inherit;font-size:12px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:background .15s,border-color .15s,transform .1s}
  .seg button:hover,.btn:hover{background:rgba(255,255,255,.11)}
  .seg button:active,.btn:active{transform:scale(.97)}
  .seg button.on{background:color-mix(in srgb,var(--accent) 34%,transparent);border-color:var(--accent)}
  .seg button:focus-visible,.btn:focus-visible,#panelBtn:focus-visible,#dock button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px}
  input[type=range]{width:100%;accent-color:var(--accent)}
  select{font:inherit;font-size:12px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
  select option{color:#111}
  .row{display:flex;gap:8px;align-items:center}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  #timeLabel{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
  #timeSub{font-size:11px;color:var(--ink-dim)}

  /* info card */
  #info{left:14px;bottom:calc(74px + var(--safe-b));width:340px;max-width:calc(100vw - 28px);border-radius:18px;padding:16px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #info h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  #info .sub{margin:3px 0 0;font-size:12.5px;color:var(--ink-dim)}
  #info .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
  #info .stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  #info .stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  #info .stat span{font-size:11px;color:var(--ink-dim)}
  #infoClose{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;border:0;background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer}

  /* dock */
  #dock{left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:18px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
  #dock::-webkit-scrollbar{display:none}
  #dock button{flex:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:12px;padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
  #dock button:hover{background:rgba(255,255,255,.08)}
  #dock button.on{background:color-mix(in srgb,var(--accent) 38%,transparent);border-color:var(--accent)}
  #dock .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}

  #compass{left:14px;bottom:calc(74px + var(--safe-b));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink)}
  #compass i{position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(255,255,255,.2)}
  #compass span{position:absolute;top:2px;left:50%;transform:translateX(-50%);color:#ff6b7a;font-size:10px}
  #hint{right:14px;bottom:calc(20px + var(--safe-b));font-size:11.5px;color:var(--ink-dim);text-align:right;pointer-events:none;text-shadow:0 1px 8px #000}
  #perf{left:14px;top:calc(76px + var(--safe-t));font:11px ui-monospace,Menlo,monospace;color:#9fffc4;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:8px;white-space:pre}

  /* loader / fatal */
  #loader,#fatal{position:absolute;inset:0;z-index:20;display:grid;place-content:center;justify-items:center;gap:16px;background:radial-gradient(1200px 700px at 50% 40%,#151a3a,#070914);transition:opacity .7s .1s}
  #loader.done{opacity:0;pointer-events:none}
  #loader .spin{width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loader p{margin:0;font-size:13px;color:var(--ink-dim)}
  #loader .bar{width:220px;height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  #fatal{z-index:30;text-align:center;padding:24px}
  #fatal h2{margin:0;font-size:18px}
  #fatal p{margin:0;max-width:460px;color:var(--ink-dim);font-size:13.5px;line-height:1.5}

  @media (max-width:720px){
    #panel{left:14px;right:14px;width:auto;top:calc(66px + var(--safe-t));max-height:52%}
    #info{left:10px;right:10px;width:auto;bottom:calc(72px + var(--safe-b))}
    #compass,#hint{display:none}
  }
  body.embed #title,body.embed #dock,body.embed #hint,body.embed #compass,body.embed #info,body.embed #panelBtn,body.embed #panel,body.embed #loader,body.embed #fatal{display:none!important}
  body.embed #loader p,body.embed #loader .bar{display:none}
  @media (prefers-reduced-motion:reduce){ #info{animation:none} #loader{transition:none} }
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ═══════════ 0 · CONFIG & DATA (your proof-of-concept data model, kept as-is) ═══════════ */
const CAMPUS = { lat: 43.65539, lon: -79.73846, tz: 'America/Toronto' };
const Q = new URLSearchParams(location.search);
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const CFG = Object.assign({ accent: null, season: 'auto', weather: 'live', quality: 'auto', building: null, time: 'live' }, window.DAVIS_TWIN_CONFIG || {});
for (const k of ['accent', 'season', 'weather', 'quality', 'building', 'time']) if (Q.has(k)) CFG[k] = Q.get(k);
if (CFG.quality === 'auto' && ls.get('davis-quality')) CFG.quality = ls.get('davis-quality');
const DEBUG = Q.has('debug'); if (Q.has('embed')) document.body.classList.add('embed');
const HOST_ORIGIN = location.origin;
const $ = id => document.getElementById(id);

const CAMPUS_ASSET_ROOT = 'assets/campus/';
const CAMPUS_ASSETS = Object.freeze({
  normalCar: CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar1.obj',
  normalCarMtl: CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar1.mtl',
  driveVariant: ['NormalCar1', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar1.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar1.mtl'],
  carVariants: [
    ['NormalCar1', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar1.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar1.mtl'],
    ['NormalCar2', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar2.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/NormalCar2.mtl'],
    ['SUV', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/SUV.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/SUV.mtl'],
    ['SportsCar', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/SportsCar.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/SportsCar.mtl'],
    ['SportsCar2', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/SportsCar2.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/SportsCar2.mtl'],
    ['Taxi', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/Taxi.obj', CAMPUS_ASSET_ROOT + 'cars/Realistic Car Pack - Nov 2018/OBJ/Taxi.mtl']
  ],
  bus: CAMPUS_ASSET_ROOT + 'transit/Public Transport Pack - Feb 2017/OBJ/Bus.obj',
  busMtl: CAMPUS_ASSET_ROOT + 'transit/Public Transport Pack - Feb 2017/OBJ/Bus.mtl',
  schoolBus: CAMPUS_ASSET_ROOT + 'transit/Public Transport Pack - Feb 2017/OBJ/SchoolBus.obj',
  schoolBusMtl: CAMPUS_ASSET_ROOT + 'transit/Public Transport Pack - Feb 2017/OBJ/SchoolBus.mtl'
});
const ASSET_STATE = { format: 'obj+mtl', car: 'pending', transit: { bus: 'pending', schoolBus: 'pending' }, errors: [] };
const vehicleCache = new Map();

const CAR_PAINT_MATERIAL = /^(blue|lightblue|white|orange|darkorange|yellow|red|green|maroon|material\.007)$/i;
function styleNativeVehicleMaterial(material, kind, meshName = '') {
  if (!material?.color) return;
  const name = String(material.name || '').trim().toLowerCase();
  const mesh = String(meshName || '').toLowerCase();
  if (kind === 'bus' || kind === 'school-bus') {
    const school = kind === 'school-bus';
    const wheel = /wheel/.test(mesh);
    /* The native front windscreens are large, almost planar rectangles. A
     * near-black replacement colour made those real Windows faces read as the
     * reported "black rectangle", especially after the distance-blur pass.
     * Keep them visibly glass-blue instead of hiding or deleting geometry. */
    const colors = school
      ? { body: '#d7aa16', window: '#2d5262', trim: '#273139', light: '#ffe6a1', wheel: '#12181d' }
      : { body: '#237f91', window: '#2a5669', trim: '#24343d', light: '#ffe6a1', wheel: '#12181d' };
    if (wheel || /wheel/.test(name)) {
      material.color.set(colors.wheel);
      material.emissive?.set('#000000');
      material.emissiveIntensity = 0;
    } else if (/window/.test(name)) {
      material.color.set(colors.window);
      material.emissive?.set('#07151c');
      material.emissiveIntensity = .16;
      material.specular?.set('#8bb7c5');
      if ('shininess' in material) material.shininess = 82;
    } else if (/light/.test(name)) {
      material.color.set(colors.light);
      material.emissive?.set(colors.light);
      material.emissiveIntensity = 0;
    } else {
      if (school && /yellow/.test(name)) material.color.set(colors.body);
      else if (!school && /top|material|details/.test(name)) material.color.set(colors.body);
      else material.color.set(colors.trim);
      if (material.emissive) {
        material.emissive.copy(material.color);
        material.emissiveIntensity = .08;
      }
    }
    material.roughness = /window/.test(name) ? .18 : .62;
    material.metalness = /wheel|bottom|bumper/.test(name) ? .35 : .06;
    material.needsUpdate = true;
  }
}

function prepareVehicleInstance(root, { color = null } = {}) {
  const result = { paint: [], head: [], tail: [], wheels: [] };
  root.traverse(mesh => {
    if (!mesh.isMesh || !mesh.material) return;
    let wheelNode = false;
    for (let owner = mesh; owner; owner = owner.parent) {
      if (/wheel/i.test(String(owner.name || ''))) { wheelNode = true; break; }
    }
    const source = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    const next = source.map(material => {
      const mat = material?.clone ? material.clone() : material;
      if (!mat) return mat;
      const name = String(mat.name || '').trim();
      const lower = name.toLowerCase();
      if (wheelNode || /wheel/.test(lower)) {
        mat.color?.set(lower.includes('grey') ? '#b8c4cf' : '#111820');
        mat.roughness = .72; mat.metalness = .18; result.wheels.push(mat);
      } else if (color && CAR_PAINT_MATERIAL.test(name)) {
        mat.color?.set(color);
        mat.emissive = mat.color.clone();
        mat.emissiveIntensity = .42;
        result.paint.push(mat);
      }
      /* TailLights contains the substring "lights"; classify the rear lamps
       * first so one material never belongs to both semantic roles. */
      if (/taillight|tail/.test(lower)) {
        mat.color?.set('#b81720'); mat.emissive = new Col('#ff1b24'); mat.emissiveIntensity = 0; result.tail.push(mat);
      } else if (/headlight|^lights?$/.test(lower)) {
        mat.color?.set('#fff0b0'); mat.emissive = new Col('#fff0b0'); mat.emissiveIntensity = 0; result.head.push(mat);
      }
      mat.needsUpdate = true;
      return mat;
    });
    mesh.material = Array.isArray(mesh.material) ? next : next[0];
  });
  return result;
}

async function loadObjModel(objUrl, mtlUrl, kind) {
  const key = `${objUrl}|${mtlUrl}`;
  if (vehicleCache.has(key)) return vehicleCache.get(key);
  const promise = (async () => {
    const materials = await new MTLLoader().loadAsync(mtlUrl);
    materials.preload();
    const source = await new OBJLoader().setMaterials(materials).loadAsync(objUrl);
    source.name = `CampusAsset:${kind}`;
    source.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(source);
    const size = box.getSize(new V3());
    const length = Math.max(size.x, size.z);
    if (!(length > 0) || !Number.isFinite(length)) throw new Error(`Invalid ${kind} OBJ bounds: ${objUrl}`);
    const targetLength = kind === 'car' ? 4.35 : 9.5;
    const holder = new THREE.Group();
    holder.name = `CampusAsset:${kind}`;
    holder.add(source);
    const factor = targetLength / length;
    holder.scale.setScalar(factor);
    source.position.set(-box.min.x - size.x / 2, -box.min.y, -box.min.z - size.z / 2);

      if (!mesh.isMesh) return;

      /* Do not receive the low-resolution shadow map on moving vehicles.

       * patches on bus/car faces as the camera moved or zoomed out. */
      mesh.receiveShadow = false;
      mesh.frustumCulled = true;
      const list = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
      list.forEach(material => {
        if (!material) return;
        material.name = material.name || 'vehicle-material';
        material.roughness = /window/i.test(material.name) ? .24 : .58;
        material.metalness = /black|grey|wheel/i.test(material.name) ? .45 : .08;
        if (/headlight|lights/i.test(material.name)) { material.emissive = material.color.clone(); material.emissiveIntensity = 0; }

function makeVehicleInstanceSet(sourceRoots, vehicles) {
  const roots = vehicles.map(vehicle => {
    const sourceRoot = sourceRoots[vehicle.modelIndex || 0] || sourceRoots[0];
    const root = cloneVehicleRoot(sourceRoot);
    root.userData.vehicleMaterials = prepareVehicleInstance(root, { color: vehicle.col });
    root.userData.vehicleModel = vehicle.modelName || sourceRoot.name;
    root.userData.vehicleColor = vehicle.col || null;
    root.position.set(vehicle.x, vehicle.y || 0, vehicle.z);
    root.rotation.y = vehicle.yaw || 0;
    root.scale.multiplyScalar(vehicle.scale || 1);
    root.traverse(mesh => { if (mesh.isMesh) { mesh.castShadow = !drivePerf.active; mesh.receiveShadow = false; } });
    scene.add(root);
    return root;
  });
  if (!roots.length) throw new Error('OBJ vehicle contained no usable instances.');
  const update = (index, vehicle) => {
    const root = roots[index];
    if (!root) return;
    root.position.set(vehicle.x, vehicle.y || 0, vehicle.z);
    root.rotation.y = vehicle.yaw || 0;
  };
  vehicles.forEach((vehicle, index) => update(index, vehicle));
  return { roots, update, vehicles };
}

function updatePublicTransport(dt) {
  if (!transit?.vehicles?.length) return;
  const stopZ = BUS_STOP[2], minZ = -246, maxZ = 92;
  transit.vehicles.forEach(v => {
    if (v.stopTimer > 0) {
      v.stopTimer = Math.max(0, v.stopTimer - dt);
    } else {
      const prevZ = v.z, nextZ = v.z + v.dir * v.speed * dt;
      const crossedStop = !v.servedStop && (
        (v.dir > 0 && prevZ < stopZ && nextZ >= stopZ) ||
        (v.dir < 0 && prevZ > stopZ && nextZ <= stopZ)
      );
      if (crossedStop) {
        v.z = stopZ;
        v.stopTimer = 2.25;
        v.servedStop = true;
      } else {
        v.z = nextZ;
      }
    }

    if (v.z >= maxZ) { v.z = maxZ; v.dir = -1; v.servedStop = false; }
    if (v.z <= minZ) { v.z = minZ; v.dir = 1; v.servedStop = false; }

    v.root.position.set(v.x, 0.04, v.z);
    /* Native Bus/SchoolBus front is local -X (the FrontWheels and windscreen
     * are at the min-X end). +/-90deg maps that -X forward vector onto the
     * campus +/-Z corridor without any hidden 180deg inversion. */
    v.root.rotation.y = v.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
    if (v.wheelRigs?.length) {
      /* The root flips to face the new travel direction at each endpoint, so
       * local forward remains -X in both directions and wheel roll stays -Z. */
      const rollDistance = -v.speed * dt;
      for (const rig of v.wheelRigs) {
        rig.roll += rollDistance / Math.max(rig.radius, .08);
        rig.pivot.rotation.set(rig.baseX, rig.baseY, rig.baseZ);
        rig.pivot.rotateZ(rig.roll);
      }
    }
  });
}
