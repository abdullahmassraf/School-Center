name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # run_attempt changes on a rerun while run_id does not, so this stays unique
  # even when the same workflow run is retried.
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test:
    name: Campus 3D regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure Chromium
        shell: bash
        run: |
          if command -v chromium >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y chromium
      - name: Run developer panel gate probe
        run: node probe_dev_panel.mjs
      # The long mobile profiler uses SwiftShader on hosted runners, where a
      # single software-rendered frame can take seconds and does not represent
      # phone GPU performance. Keep probe_mobile_interaction_perf.mjs as a
      # hardware/local diagnostic; structural performance invariants are gated
      # by the acceptance suite below.
      - name: Run campus 3D acceptance
        run: node test_campus_map_3d.js
      - name: Upload rendered vehicle QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-vehicle-visual-qa
          path: qa-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7

  deploy:
    if: github.event_name == 'push'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

