name: temporary Davis vehicle geometry smoke test

on:
  push:
    branches: [fix/davis-vehicle-geometry]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install Playwright
        run: npm install --no-save playwright@1.52.0 && npx playwright install --with-deps chromium
      - name: Run smoke
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/school-center.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          node .tmp-vehicle-geometry-smoke.mjs
