name: temporary Davis map smoke test

on:
  push:
    branches:
      - fix/map-render-recovery

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright browser
        run: npm install --no-save playwright@1.52.0 && npx playwright install --with-deps chromium
      - name: Run map smoke test
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/school-center-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          node .tmp-map-smoke.mjs
      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: davis-map-smoke
          path: /tmp/davis-map-smoke.png
