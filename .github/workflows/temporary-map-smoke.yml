name: temporary Davis map smoke test

on:
  push:
    branches:
      - fix/map-render-recovery

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright browser
        run: npm install --global --prefix /tmp/playwright playwright@1.52.0 && /tmp/playwright/bin/playwright install --with-deps chromium
      - name: Run map smoke test
        shell: bash
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/school-center-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > /tmp/map-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true,args:[
            '--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist',
            '--disable-dev-shm-usage'
          ]});
          const page = await browser.newPage({ viewport:{width:1365,height:900}, deviceScaleFactor:1 });
          const errors=[];
          page.on('pageerror', e=>errors.push('pageerror: '+e.message));
          page.on('console', msg=>{if(msg.type()==='error')errors.push('console: '+msg.text())});

          await page.goto('http://127.0.0.1:8787/index.html?map-smoke=1',{waitUntil:'domcontentloaded'});
          const deadline=Date.now()+45000;
          let state=null;
          while(Date.now()<deadline){
            state=await page.evaluate(()=>{
              const m=window.__SC_CAMPUS_MAP_3D__;
              const w=m?.frame?.contentWindow;
              const d=w?.__DAVIS_TWIN_DEBUG__;
              return {
                managerReady:!!m?.ready,
                frameReady:!!w?.DavisTwin,
                ids:w?.DavisTwin?.buildings||[],
                sceneChildren:d?.scene?.children?.length||0,
                renderCalls:d?.renderer?.info?.render?.calls||0,
                assets:d?.ASSET_STATE||null,
                trafficMode:d?.traffic?.mode||null,
                transitCount:d?.transit?.vehicles?.length||0
              };
            });
            if(state.managerReady && state.frameReady && state.sceneChildren>5 && state.renderCalls>0)break;
            await new Promise(r=>setTimeout(r,500));
          }
          if(!state?.managerReady || !state?.frameReady || state.sceneChildren<=5 || state.renderCalls<=0)
            throw new Error('map failed to become render-ready within 45s: '+JSON.stringify(state));
          for(const id of ['J','H','M','B','C','A']) if(!state.ids.includes(id)) throw new Error('missing building '+id);

          await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.focus('H'));
          await page.waitForTimeout(1200);
          let focused=await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.frame.contentWindow.__DAVIS_TWIN_DEBUG__.ST.sel);
          if(focused!=='H')throw new Error('building focus failed: '+focused);

          await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.showRoute('H'));
          await page.waitForTimeout(300);
          const route=await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.frame.contentWindow.__DAVIS_TWIN_DEBUG__.R.grp.visible);
          if(!route)throw new Error('route failed');

          await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.reset());
          await page.waitForTimeout(300);
          const reset=await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.frame.contentWindow.__DAVIS_TWIN_DEBUG__.ST.sel);
          if(reset!==null)throw new Error('reset failed: '+reset);

          await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.setAccent('#ff4fd8'));
          await page.waitForTimeout(150);
          const accent=await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.frame.contentWindow.__DAVIS_TWIN_DEBUG__.ST.accent);
          if(!accent)throw new Error('accent propagation failed');

          await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.setWeather('rain'));
          await page.waitForTimeout(150);
          const weather=await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.frame.contentWindow.__DAVIS_TWIN_DEBUG__.W.rain);
          if(!(weather>0))throw new Error('weather propagation failed');

          await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.setTime('2026-12-21T21:30:00-05:00'));
          await page.waitForTimeout(300);
          const night=await page.evaluate(()=>window.__SC_CAMPUS_MAP_3D__.frame.contentWindow.__DAVIS_TWIN_DEBUG__.ST.night);
          if(!(night>0.2))throw new Error('time propagation failed: '+night);

          const screenshot='/tmp/davis-map-smoke.png';
          await page.locator('.cm3d-mount').screenshot({path:screenshot});
          console.log('PASS',JSON.stringify({state,focused,route,reset,accent,weather,night,errors}));
          if(errors.length) throw new Error('browser errors: '+errors.join(' | '));
          await browser.close();
          EOF
          NODE_PATH=/tmp/playwright/lib/node_modules node /tmp/map-smoke.mjs
      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: davis-map-smoke
          path: /tmp/davis-map-smoke.png
