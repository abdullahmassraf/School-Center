<style>
  :root{
    /* ---- theme-controlled tokens (rewritten live by THEME_PRESETS / custom picker) ---- */
    --ink:#F4F6FD;
    --muted:#A7B0D6;
    --muted-dim:#7981A8;
    --accent:#8B7CF6;
    --accent-2:#34D1BF;
    --accent-3:#F0608A;
    --bg-1:#0B0F2E;
    --bg-2:#0E1A3D;
    --bg-3:#0A2A44;
    --lava-a:#8B7CF6;
    --lava-b:#5B4FD6;
    --lava-c:#34D1BF;
    --lava-d:#F0608A;

    /* ---- iPhone-glass tokens (derived, but exposed so panels stay consistent) ---- */
    --glass: rgba(255,255,255,0.07);
    --glass-hi: rgba(255,255,255,0.14);
    --glass-border: rgba(255,255,255,0.22);
    --glass-spec: rgba(255,255,255,0.55);
    --hairline: rgba(255,255,255,0.09);
    --radius-lg: 22px;
    --radius-md: 15px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg-1);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', sans-serif;
    font-size:16px;
    line-height:1.65;
    letter-spacing:0.01em;
    -webkit-font-smoothing:antialiased;
  }
  .headfont{font-family:'Space Grotesk', sans-serif;}
  #app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:26px 16px 90px;}

  /* ---------- lava lamp interactive background ---------- */
  #lava-wrap{position:fixed;inset:0;z-index:0;overflow:hidden;background:
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);}
  #lava-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #lava-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1400px 900px at 50% -10%, rgba(255,255,255,0.05), transparent 60%);}
  #lava-vignette{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 160px 40px rgba(4,6,20,0.55);}

  /* ---------- true glass (iPhone-style) ---------- */
  .glass-surface{
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    box-shadow:
      0 1px 0 0 var(--glass-spec) inset,
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 18px 40px -12px rgba(2,4,16,0.55);
    position:relative;
  }
  .glass-surface::before{
    content:"";position:absolute;top:0;left:8%;right:8%;height:1px;border-radius:99px;
    background:linear-gradient(90deg, transparent, var(--glass-spec), transparent);
    opacity:0.5;pointer-events:none;
  }

  @keyframes riseIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  .enter{animation:riseIn .55s cubic-bezier(.2,.7,.3,1) both;}
  @keyframes viewIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  #app > *{animation:viewIn .35s ease both;}

  /* header */
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    margin-bottom:22px;}
  .topbar h1{font-family:'Space Grotesk';font-weight:700;font-size:1.65rem;margin:0;letter-spacing:0.01em;}
  .topbar .sub{color:var(--muted);font-size:0.9rem;margin-top:2px;}
  .today-badge{font-family:'Space Grotesk';font-size:0.78rem;color:var(--ink);
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    padding:6px 14px;border-radius:999px;white-space:nowrap;
    box-shadow:0 1px 0 0 var(--glass-spec) inset;}

  .progress-pill{display:flex;align-items:center;gap:10px;font-size:0.78rem;color:var(--muted);
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));border:1px solid var(--glass-border);
    border-radius:999px;padding:6px 14px 6px 6px;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset;}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:50%;background:linear-gradient(155deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);color:var(--ink);cursor:pointer;font-size:1rem;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset;transition:transform .15s ease, border-color .15s ease;}
  .icon-btn:hover{transform:translateY(-1px) scale(1.04);border-color:var(--accent);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0.9;}
  .icon-inline{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-inline svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .progress-track{display:flex;gap:3px;}
  .progress-seg{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,0.14);}
  .progress-seg.on{background:var(--seg-color, var(--accent));}

  /* glass panel */
  .panel{position:relative;
    background:linear-gradient(160deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    backdrop-filter:blur(26px) saturate(180%);
    border-radius:var(--radius-lg);
    box-shadow:
      0 1px 0 0 var(--glass-spec) inset,
      0 18px 40px -12px rgba(2,4,16,0.55);
    padding:20px 20px 22px;margin-bottom:20px;overflow:hidden;}
  .panel::before{
    content:"";position:absolute;top:0;left:8%;right:8%;height:1px;border-radius:99px;
    background:linear-gradient(90deg, transparent, var(--glass-spec), transparent);
    opacity:0.5;pointer-events:none;}
  .panel h2{font-family:'Space Grotesk';font-size:1rem;font-weight:600;margin:0 0 14px;color:var(--ink);}

  .panel-flush{padding:0;overflow:hidden;}

  /* practice studio — true fullscreen overlay, independent of #app's layout */
  .ps-fullscreen{position:fixed;inset:0;z-index:80;background:#0B0F19;display:flex;flex-direction:column;}
  .ps-topbar{display:flex;align-items:center;gap:12px;padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top));
    background:#0B0F19;border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;}
  .ps-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:0.85rem;
    padding:6px 10px;border-radius:999px;transition:background .15s ease, color .15s ease;}
  .ps-back:hover{background:rgba(255,255,255,0.08);color:var(--ink);}
  .ps-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ps-label{font-family:'Space Grotesk';font-size:0.85rem;font-weight:600;color:var(--ink);}
  .ps-iframe{flex:1;width:100%;border:none;background:#0B0F19;}

  .dim-divider{display:flex;align-items:center;gap:10px;margin:16px 0 10px;color:var(--muted-dim);font-size:0.75rem;
    font-family:'Space Grotesk';}
  .dim-divider::before,.dim-divider::after{content:"";flex:1;height:1px;background:var(--hairline);}

  /* weekly schedule */
  .week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  @media(max-width:680px){.week-grid{grid-template-columns:1fr;}}
  .day-col{border:1px solid var(--hairline);border-radius:var(--radius-md);padding:12px;min-height:76px;
    background:rgba(255,255,255,0.02);transition:border-color .2s ease;}
  .day-col.is-today{border-color:rgba(139,124,246,0.55);background:rgba(139,124,246,0.08);}
  .day-name{font-family:'Space Grotesk';font-size:0.8rem;color:var(--muted);margin-bottom:9px;font-weight:600;}
  .day-col.is-today .day-name{color:#C4BAFF;}
  .block{border-left:3px solid var(--block-color, #8B7CF6);
    background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    padding:7px 9px;margin-bottom:7px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
    cursor:pointer;font-size:0.82rem;transition:transform .15s ease, background .15s ease;}
  .block:hover{transform:translateX(3px);background:linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));}
  .block .t{color:var(--muted);font-size:0.71rem;}
  .block .c{font-weight:700;}
  .empty-day{color:var(--muted-dim);font-size:0.78rem;font-style:italic;}

  /* calendar widget */
  .cal-widget{padding-bottom:14px;}
  .cal-widget-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .cal-widget-head h2{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cal-widget-head h2 .icon-inline svg{width:16px;height:16px;color:var(--accent);}
  .cal-widget-sub{font-family:'Atkinson Hyperlegible';font-weight:400;font-size:0.78rem;color:var(--muted);}
  .cal-caret svg{transition:transform .2s ease;}
  .cal-caret.open svg{transform:rotate(180deg);}
  .cal-est{color:var(--accent-3);font-weight:700;cursor:help;}

  .mini-cal-nav{display:flex;align-items:center;gap:10px;margin-top:16px;}
  .mini-cal-month{flex:1;text-align:center;font-size:0.92rem;font-weight:600;}
  .icon-btn.sm{width:28px;height:28px;}
  .icon-btn.sm svg{width:14px;height:14px;}
  .cal-today-btn{font-family:'Space Grotesk';font-size:0.72rem;color:var(--accent);cursor:pointer;
    border:1px solid var(--glass-border);border-radius:999px;padding:4px 12px;white-space:nowrap;
    transition:border-color .15s ease, background .15s ease;}
  .cal-today-btn:hover{border-color:var(--accent);background:rgba(139,124,246,0.1);}
  .cal-clear-day{color:var(--accent);cursor:pointer;font-weight:400;font-size:0.72rem;}

  .mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;}
  .mini-cal-dow{text-align:center;font-family:'Space Grotesk';font-size:0.68rem;color:var(--muted-dim);padding-bottom:4px;}
  .mini-cal-cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-sm);font-size:0.78rem;color:var(--muted);background:rgba(255,255,255,0.03);
    cursor:pointer;transition:background .15s ease, box-shadow .15s ease;}
  .mini-cal-cell:not(.empty):hover{background:rgba(255,255,255,0.09);}
  .mini-cal-cell.empty{background:transparent;cursor:default;}
  .mini-cal-cell.today{background:rgba(139,124,246,0.22);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px rgba(139,124,246,0.55) inset;}
  .mini-cal-cell.selected{box-shadow:0 0 0 2px var(--accent) inset;color:var(--ink);}
  .mini-cal-cell.has-dot .mini-cal-num{margin-bottom:2px;}
  .mini-cal-dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent-3);}

  .cal-list{display:flex;flex-direction:column;gap:6px;}
  .cal-row{display:flex;align-items:flex-start;gap:12px;border-left:3px solid var(--block-color,#8B7CF6);
    background:linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    padding:8px 10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;cursor:pointer;
    transition:transform .15s ease, background .15s ease;}
  .cal-row:hover{transform:translateX(3px);background:linear-gradient(90deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));}
  .cal-row.past{opacity:0.5;}
  .cal-date{font-family:'Space Grotesk';font-size:0.72rem;color:var(--muted);min-width:56px;flex-shrink:0;padding-top:1px;}
  .cal-main{flex:1;}
  .cal-course{font-family:'Space Grotesk';font-size:0.72rem;font-weight:700;color:var(--muted);}
  .cal-item{font-size:0.85rem;margin-top:2px;}

  /* course grid — kanban-style cards */
  .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;}
  .course-card{position:relative;overflow:hidden;border:1px solid var(--glass-border);border-radius:var(--radius-md);
    padding:16px 16px 15px;cursor:pointer;background:linear-gradient(165deg, var(--glass-hi), var(--glass));
    transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s ease, border-color .18s ease;}
  .course-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--card-color, #8B7CF6);}
  .course-card:hover{transform:translateY(-4px);border-color:var(--card-color, #8B7CF6);
    box-shadow:0 16px 34px -10px var(--card-color, #8B7CF6);}
  .course-card .code{font-family:'Space Grotesk';font-size:0.72rem;color:var(--muted);margin-top:4px;}
  .course-card .name{font-weight:700;margin:5px 0;font-size:1.05rem;}
  .course-card .instr{color:var(--muted);font-size:0.8rem;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:0.7rem;
    padding:3px 10px;border-radius:999px;font-family:'Space Grotesk';}
  .status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .status-pill.has{background:color-mix(in srgb, var(--card-color,#8B7CF6) 18%, transparent);
    color:var(--card-color,#8B7CF6);}
  .status-pill.none{background:rgba(255,255,255,0.06);color:var(--muted-dim);}

  /* course detail */
  .backlink{color:var(--muted);cursor:pointer;font-size:0.85rem;display:inline-flex;align-items:center;gap:6px;
    margin-bottom:4px;transition:color .15s ease;}
  .backlink svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .backlink:hover{color:var(--ink);}
  .course-header{padding:4px 2px 0;}
  .course-header h2{font-size:1.4rem;margin:0;}
  .course-header .meta{color:var(--muted);font-size:0.88rem;margin-top:4px;}
  .course-header .accent-dot{display:inline-block;width:10px;height:10px;border-radius:50%;
    background:var(--course-accent, #8B7CF6);margin-right:9px;box-shadow:0 0 12px var(--course-accent, #8B7CF6);}

  .tabs{display:inline-flex;gap:2px;background:linear-gradient(155deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);border-radius:999px;margin:18px 0 18px;padding:4px;
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset;flex-wrap:wrap;}
  .tab{font-family:'Space Grotesk';font-size:0.83rem;padding:8px 15px;cursor:pointer;color:var(--muted);
    border-radius:999px;transition:background .18s ease, color .18s ease;}
  .tab.active{color:#0B0F2E;background:var(--course-accent, var(--accent));font-weight:600;}

  .lecture-block{border:1px solid var(--hairline);border-radius:var(--radius-md);padding:16px 17px;margin-bottom:13px;
    background:rgba(255,255,255,0.025);}
  .lecture-block h3{font-family:'Space Grotesk';font-size:1rem;margin:0 0 10px;color:var(--ink);}
  .concept-list{margin:0;padding-left:0;list-style:none;}
  .concept-list li{margin-bottom:9px;padding-left:16px;position:relative;}
  .concept-list li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
    background:var(--course-accent, #8B7CF6);}
  .concept-list b{color:var(--course-accent, #8B7CF6);font-weight:700;}

  .ws-list{margin:0;padding-left:0;list-style:none;}
  .ws-list li{margin-bottom:10px;padding-left:26px;position:relative;}
  .ws-list li::before{content:"—";position:absolute;left:0;color:var(--course-accent, #8B7CF6);font-weight:700;}

  /* worksheet bars */
  .ws-bar-list{display:flex;flex-direction:column;gap:10px;}
  .ws-bar{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;cursor:pointer;
    background:rgba(255,255,255,0.035);border:1px solid var(--hairline);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;}
  .ws-bar:hover{transform:translateX(3px);background:rgba(255,255,255,0.07);border-color:var(--course-accent, #8B7CF6);}
  .ws-bar-icon{flex-shrink:0;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.06);color:var(--course-accent, #8B7CF6);}
  .ws-bar-icon svg{width:18px;height:18px;}
  .ws-bar-text{flex:1;min-width:0;}
  .ws-bar-title{font-family:'Space Grotesk';font-size:0.92rem;font-weight:600;color:var(--ink);}
  .ws-bar-sub{font-size:0.76rem;color:var(--muted);margin-top:2px;}
  .ws-bar-chev{flex-shrink:0;color:var(--muted-dim);}
  .ws-bar-chev svg{width:16px;height:16px;}
  .ws-bar-ai{background:linear-gradient(120deg, rgba(139,92,246,0.14), rgba(6,182,212,0.08));
    border-color:rgba(139,92,246,0.35);}
  .ws-bar-ai .ws-bar-icon{background:linear-gradient(135deg, #8B5CF6, #06B6D4);color:#fff;}
  .ws-bar-ai:hover{border-color:#8B5CF6;}

  .ws-detail-head{margin-bottom:14px;}
  .panel-flush .ws-detail-head{padding:16px 18px 0;margin-bottom:0;}
  .panel-flush .lecture-block{margin:0 18px 18px;}

  table.syllabus{width:100%;border-collapse:collapse;font-size:0.85rem;}
  table.syllabus th,table.syllabus td{border-bottom:1px solid var(--hairline);padding:9px 7px;text-align:left;
    vertical-align:top;}
  table.syllabus th{color:var(--muted);font-family:'Space Grotesk';font-weight:600;font-size:0.74rem;}
  table.syllabus tr:hover td{background:rgba(255,255,255,0.03);}

  .eval-grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:0.9rem;}
  .eval-grid .v{color:var(--course-accent, #8B7CF6);font-family:'Space Grotesk';font-weight:600;text-align:right;}

  /* notes */
  .note-form{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap;}
  .note-form textarea{flex:1;min-width:200px;background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);color:var(--ink);font-family:inherit;font-size:0.92rem;padding:11px 13px;
    resize:vertical;min-height:46px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .note-form textarea:focus{outline:none;border-color:var(--course-accent, #8B7CF6);}
  .note-form button{font-family:'Space Grotesk';background:var(--course-accent, #8B7CF6);color:#0B0F2E;border:none;
    border-radius:999px;padding:0 20px;font-weight:700;cursor:pointer;font-size:0.85rem;
    transition:filter .15s ease, transform .15s ease;}
  .note-form button:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .note-item{border:1px solid var(--hairline);border-left:3px solid var(--course-accent, #8B7CF6);
    border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:9px;position:relative;
    background:rgba(255,255,255,0.02);}
  .note-item .when{color:var(--muted-dim);font-size:0.72rem;margin-bottom:5px;font-family:'Space Grotesk';}
  .note-item .del{position:absolute;top:11px;right:13px;color:var(--muted-dim);cursor:pointer;font-size:0.73rem;
    transition:color .15s ease;}
  .note-item .del:hover{color:var(--course-accent, #8B7CF6);}
  .no-notes{color:var(--muted-dim);font-style:italic;font-size:0.88rem;}
  .no-material{color:var(--muted-dim);font-style:italic;padding:16px 4px;}

  .footer-note{color:var(--muted-dim);font-size:0.78rem;text-align:center;margin-top:32px;}

  /* ---------- theme swatches ---------- */
  .theme-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .swatch{width:38px;height:38px;border-radius:50%;cursor:pointer;position:relative;flex:none;
    border:2px solid rgba(255,255,255,0.18);transition:transform .15s ease, border-color .15s ease;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);}
  .swatch:hover{transform:translateY(-2px) scale(1.05);}
  .swatch.active{border-color:#fff;box-shadow:0 0 0 3px var(--accent), 0 4px 14px rgba(0,0,0,0.35);}
  .swatch-custom{display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--ink);
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));}
  input[type="color"].theme-color-input{-webkit-appearance:none;appearance:none;width:38px;height:38px;
    border:2px solid rgba(255,255,255,0.18);border-radius:50%;padding:0;cursor:pointer;background:none;}
  input[type="color"].theme-color-input::-webkit-color-swatch-wrapper{padding:0;border-radius:50%;}
  input[type="color"].theme-color-input::-webkit-color-swatch{border:none;border-radius:50%;}

  /* ---------- settings modal ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(4,6,18,0.55);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .modal{width:100%;max-width:560px;max-height:85vh;overflow-y:auto;
    background:linear-gradient(160deg, var(--glass-hi), var(--glass));
    border:1px solid var(--glass-border);border-radius:var(--radius-lg);
    -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
    box-shadow:0 1px 0 0 var(--glass-spec) inset, 0 30px 70px -20px rgba(2,4,16,0.7);
    padding:22px 22px 24px;position:relative;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h2{margin:0;font-family:'Space Grotesk';font-size:1.15rem;}
  .modal-close{cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px;display:inline-flex;}
  .modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  .modal-close:hover{color:var(--ink);}
  .field-label{font-family:'Space Grotesk';font-size:0.78rem;color:var(--muted);margin:16px 0 7px;
    text-transform:none;}
  .field-label:first-child{margin-top:0;}
  .modal input[type="text"], .modal input[type="password"]{width:100%;background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--ink);
    font-family:inherit;font-size:0.9rem;padding:11px 13px;}
  .modal input:focus{outline:none;border-color:var(--accent);}
  .hint{color:var(--muted-dim);font-size:0.76rem;margin-top:6px;line-height:1.5;}
  .btn-primary{font-family:'Space Grotesk';background:var(--accent);color:#0B0F2E;border:none;
    border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;font-size:0.85rem;
    transition:filter .15s ease, transform .15s ease;}
  .btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
  .btn-ghost{font-family:'Space Grotesk';background:rgba(255,255,255,0.06);color:var(--ink);
    border:1px solid var(--glass-border);border-radius:999px;padding:9px 18px;font-weight:600;
    cursor:pointer;font-size:0.83rem;transition:background .15s ease;}
  .btn-ghost:hover{background:rgba(255,255,255,0.1);}

  .upload-drop{border:1.5px dashed var(--glass-border);border-radius:var(--radius-md);
    padding:22px 16px;text-align:center;color:var(--muted);cursor:pointer;font-size:0.85rem;
    transition:border-color .15s ease, background .15s ease;}
  .upload-drop:hover, .upload-drop.drag{border-color:var(--accent);background:rgba(255,255,255,0.04);}
  .upload-select{font-family:'Space Grotesk';background:rgba(255,255,255,0.06);border:1px solid var(--glass-border);
    border-radius:var(--radius-sm);color:var(--ink);padding:9px 11px;font-size:0.85rem;width:100%;margin-top:10px;}
  .file-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:rgba(255,255,255,0.05);border:1px solid var(--hairline);border-radius:var(--radius-sm);
    padding:9px 12px;margin-top:9px;font-size:0.82rem;}
  .file-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-chip .status{color:var(--muted-dim);font-size:0.72rem;flex:none;}
  .file-chip .status.ok{color:var(--accent-2);}
  .file-chip .status.err{color:var(--accent-3);}
  .file-chip .rm{cursor:pointer;color:var(--muted-dim);flex:none;display:inline-flex;}
  .file-chip .rm svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
  .file-chip .rm:hover{color:var(--ink);}
  .ai-log{margin-top:12px;font-size:0.78rem;color:var(--muted-dim);max-height:140px;overflow-y:auto;
    border-top:1px solid var(--hairline);padding-top:10px;font-family:monospace;}
  .ai-log div{margin-bottom:4px;}
  .settings-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;
    background:linear-gradient(155deg, var(--glass-hi), var(--glass));border:1px solid var(--glass-border);
    -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
    padding:10px 18px;border-radius:999px;font-size:0.82rem;box-shadow:0 12px 30px rgba(0,0,0,0.4);
    animation:riseIn .3s ease both;}

  .katex-display{margin:8px 0 !important;overflow-x:auto;overflow-y:hidden;padding:4px 0;}
</style>
</head>

<div id="lava-wrap">
  <canvas id="lava-canvas"></canvas>

</div>

<div id="app"></div>
